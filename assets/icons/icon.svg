<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#141413"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#DCD7CD" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Central Flask & Surface Antarmuka Blueprint -->
  <g transform="translate(256, 256)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fluid Meniscus & Interface -->
    <path d="M-130,40 C-60,50 60,30 130,40" fill="none" stroke="#38BDF8" stroke-width="8"/>
    
    <!-- Laboratory Flask Outline -->
    <path d="M-45,-140 L-45,-40 L-140,110 C-155,135 -135,160 -105,160 L105,160 C135,160 155,135 140,110 L45,-40 L45,-140" fill="none" stroke="#FBF9F5" stroke-width="12"/>
    <line x1="-60" y1="-140" x2="60" y2="-140" stroke="#FBF9F5" stroke-width="12"/>
    
    <!-- Dispersed Nanoparticles / Micelles -->
    <circle cx="-50" cy="90" r="14" fill="#D97706"/>
    <circle cx="40" cy="110" r="18" fill="#1D4ED8"/>
    <circle cx="20" cy="65" r="10" fill="#0F766E"/>
    <circle cx="-20" cy="130" r="12" fill="#B91C1C"/>

    <!-- Light Ray / Rayleigh Beam Passing Through -->
    <line x1="-200" y1="80" x2="200" y2="80" stroke="#F59E0B" stroke-width="6" stroke-dasharray="8 6"/>
  </g>
</svg>
