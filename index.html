<!DOCTYPE html>

  <title>Kimia Koloid & Kimia Permukaan — Laboratorium Fisika S1 Kimia Murni</title>
  <meta name="description" content="Aplikasi edukasi sains interaktif kimia koloid dan kimia permukaan tingkat S1: termodinamika antarmuka, hamburan Rayleigh-Tyndall, difusi Stokes-Einstein, teori DLVO, adsorpsi Gibbs, CMC, dan isoterm Langmuir-BET.">

            <circle cx="14" cy="15" r="1.5" fill="currentColor"/>

        </div>
        <div class="masthead-titles">

          <span class="masthead-subtitle">Standard S1 Kimia Murni • Fisikokimia Intermuka</span>

            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>Diagnostik</span>
        </a>
